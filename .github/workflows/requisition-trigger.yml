name: Requisition email trigger

# Event-driven counterpart to scrape.yml: instead of waiting up to 30 minutes
# for the next scheduled pass, a "New requisition from NextEra Energy submitted
# [... Requisition ID: NEEJP00020528 ...]" email scrapes that ONE posting within
# about a minute.
#
# GitHub Actions cannot listen for email, so the push comes from outside:
#   Gmail -> Apps Script (time trigger, 1 min, runs free on Google's infra)
#         -> POST /repos/:owner/:repo/dispatches {event_type: new-requisition}
#         -> this workflow -> targeted Playwright scrape -> masked upsert
# Source + setup for the Apps Script side: scripts/apps-script/ and
# docs/email-trigger-setup.md.
#
# Why this shape: polling Gmail from a scheduled workflow would cost ~8,600
# runner minutes/month (~$50+) because it runs whether or not mail arrived.
# Here minutes are only spent when a requisition actually lands.
#
# NOTE: repository_dispatch only ever runs the workflow file as it exists on the
# DEFAULT branch. This file has to be on main before any dispatch will fire —
# testing it from a feature branch silently does nothing.
#
# Governance: no Gmail credentials live here. The mailbox is only ever touched
# by Apps Script under the mailbox owner's own Google account, and the only
# thing crossing into GitHub is a job id. Fieldglass creds + DATABASE_URL come
# from repository Secrets, exactly as in scrape.yml, and masking still runs
# before any DB insert.

on:
  repository_dispatch:
    types: [new-requisition]
  # Manual escape hatch: run one posting straight from the Actions tab.
  workflow_dispatch:
    inputs:
      job_id:
        description: "Fieldglass job id, e.g. NEEJP00020528"
        required: true
        type: string

# Share scrape.yml's group so a targeted run and the 30-minute full scrape never
# hold two Fieldglass sessions open at once. Consequence to be aware of: if a
# burst of requisitions arrives, GitHub keeps only ONE run queued per group and
# drops the rest — those postings simply wait for the next scheduled full scrape,
# which is the backstop this whole design leans on.
concurrency:
  group: fieldglass-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-one:
    runs-on: ubuntu-latest
    # Covers the 3-minute retry wait, plus chunk+embed with a possible ~1 min
    # cold start on the scale-to-zero embed service.
    timeout-minutes: 25
    steps:
      # The payload arrives from outside the repo, so it is treated as untrusted:
      # read via env (never interpolated into a shell line, which would be a
      # script-injection hole) and every id checked against the Fieldglass id
      # shape before any of it reaches Playwright.
      #
      # Accepts one id or a comma-separated list: Apps Script batches a cluster
      # of requisition emails into a single dispatch so the concurrency group
      # can't cancel the surplus runs.
      - name: Validate job id(s)
        id: check
        env:
          RAW_IDS: ${{ github.event.client_payload.job_id || inputs.job_id }}
        run: |
          CLEAN=""
          COUNT=0
          IFS=',' read -ra PARTS <<< "$RAW_IDS"
          for raw in "${PARTS[@]}"; do
            id="$(echo "$raw" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            [ -z "$id" ] && continue
            if [[ ! "$id" =~ ^[A-Z0-9_-]{3,40}$ ]]; then
              echo "::error::Rejected job id: '$raw' (expected 3-40 chars of A-Z, 0-9, _ or -)"
              exit 1
            fi
            # Skip duplicates — the same requisition can be emailed twice.
            case ",$CLEAN," in *",$id,"*) continue ;; esac
            CLEAN="${CLEAN:+$CLEAN,}$id"
            COUNT=$((COUNT + 1))
          done

          if [ -z "$CLEAN" ]; then
            echo "::error::No usable job id in payload: '$RAW_IDS'"
            exit 1
          fi
          # Mirrors MAX_THREADS_PER_RUN in the Apps Script. A payload far larger
          # than a plausible mail cluster means something is wrong upstream.
          if [ "$COUNT" -gt 25 ]; then
            echo "::error::$COUNT job ids in one dispatch (max 25) — refusing"
            exit 1
          fi

          echo "job_ids=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Triggered for $COUNT posting(s): $CLEAN"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Drives the scrape spec's targeted mode directly (FIELDGLASS_JOB_IDS),
      # which visits every requested posting in ONE browser session — so a
      # cluster costs one login, not one per posting. No Gmail credentials are
      # needed here.
      #
      # The spec prints `TARGET_NOT_FOUND: <id>` for postings missing from the
      # work-items list, which happens routinely: the notification email
      # regularly beats the Fieldglass UI by a few minutes. The local watcher
      # rides a 3/7/15/30/60 minute ladder, but idling a runner through that
      # would burn paid minutes, so this retries ONLY the missing ids once and
      # then defers the stragglers to the scheduled scrape.
      - name: Scrape the new posting(s) (with one delayed retry)
        env:
          JOB_IDS: ${{ steps.check.outputs.job_ids }}
          FIELDGLASS_HEADLESS: "1"
          FIELDGLASS_URL: ${{ secrets.FIELDGLASS_URL }}
          FIELDGLASS_USERNAME: ${{ secrets.FIELDGLASS_USERNAME }}
          FIELDGLASS_PASSWORD: ${{ secrets.FIELDGLASS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          LOG=/tmp/scrape.log

          scrape() {
            echo "→ scraping: $1"
            FIELDGLASS_JOB_IDS="$1" \
              npx playwright test tests/fieldglass-scrape.spec.ts --reporter=list 2>&1 | tee "$LOG"
            return "${PIPESTATUS[0]}"
          }

          # Ids the spec reported as absent from the work-items list. grep
          # finding nothing is not an error here — it means everything landed.
          missing() {
            grep -oE 'TARGET_NOT_FOUND: [A-Za-z0-9_-]+' "$LOG" \
              | awk '{print $2}' | sort -u | paste -sd, - || true
          }

          rc=0; scrape "$JOB_IDS" || rc=$?
          MISS="$(missing)"

          # A non-zero exit with nothing missing is a REAL failure (login,
          # timeout, DB) — surface it rather than hiding it behind a warning.
          if [ "$rc" -ne 0 ] && [ -z "$MISS" ]; then
            echo "::error::Scrape failed for $JOB_IDS (exit $rc)"
            exit 1
          fi
          if [ -z "$MISS" ]; then
            echo "✓ scraped and upserted: $JOB_IDS"
            exit 0
          fi

          echo "::notice::not in the work-items list yet: $MISS — retrying those in 3 minutes"
          sleep 180

          rc=0; scrape "$MISS" || rc=$?
          MISS2="$(missing)"
          if [ "$rc" -ne 0 ] && [ -z "$MISS2" ]; then
            echo "::error::Retry failed for $MISS (exit $rc)"
            exit 1
          fi
          if [ -z "$MISS2" ]; then
            echo "✓ scraped and upserted on the second attempt: $MISS"
            exit 0
          fi

          # Not a failure worth a red X: the postings are real, Fieldglass just
          # has not published them yet, and the 30-minute full scrape will
          # collect them. Failing here would cry wolf on a routine race.
          echo "::warning::still not visible in Fieldglass after two attempts: $MISS2 — leaving them to the scheduled full scrape (scrape.yml)"

      # The whole point of the email trigger is speed, so chunk + embed here
      # too: without this the posting would sit unsearchable until the next
      # scheduled scrape, throwing away the minutes just gained. A no-op when
      # the posting wasn't found (nothing new to chunk).
      # Runs even if the scrape step failed: the spec upserts whatever it got in
      # a `finally`, so a partial run can still leave new jobs behind — and
      # skipping chunking would quietly recreate the drift this exists to stop.
      - name: Chunk and embed the new posting(s)
        if: success() || failure()
        uses: ./.github/actions/chunk-embed
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          embed-service-url: ${{ secrets.EMBED_SERVICE_URL }}
          embed-service-token: ${{ secrets.EMBED_SERVICE_TOKEN }}

      # Same rule as scrape.yml: output/*.json is UNMASKED NextEra data and is
      # never uploaded. The masked DB upsert is the persistence path.
